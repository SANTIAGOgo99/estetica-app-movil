# CI lo llama solo con un SHA habilitado. workflow_dispatch requiere la rama predeterminada.
name: Distribución interna Android
run-name: APK preview · ${{ github.ref_name }} · CI ${{ inputs.source_run_id }}
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: ID de CI aprobada por push del mismo commit en develop
        required: true
        type: string
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    name: APK interno aprobado
    if: github.ref == 'refs/heads/develop' && vars.ANDROID_PREVIEW_RELEASE_SHA == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: android-release
      url: ${{ steps.record.outputs.build_page }}
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Verificar pruebas, intento, SHA y configuración
        run: node scripts/verify-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          APPROVED_RELEASE_SHA: ${{ vars.ANDROID_PREVIEW_RELEASE_SHA }}
          RELEASE_API_URL: ${{ vars.RELEASE_API_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Confirmar acceso al proyecto existente (solo consulta)
        run: |
          npx --yes eas-cli@27.11.0 project:status --json --non-interactive --limit 1 > output/release/project-status.json
          node scripts/verify-eas-project.mjs
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Revalidar pruebas y árbol limpio antes de solicitar build
        run: node scripts/verify-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          APPROVED_RELEASE_SHA: ${{ vars.ANDROID_PREVIEW_RELEASE_SHA }}
          RELEASE_API_URL: ${{ vars.RELEASE_API_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Generar únicamente APK preview y esperar FINISHED
        run: npx --yes eas-cli@27.11.0 build --platform android --profile preview --non-interactive --wait --json > output/release/eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - id: record
        name: Verificar build, descargar APK y registrar SHA-256
        run: node scripts/release-artifact.mjs
      - name: Conservar APK y trazabilidad sin respuestas crudas ni credenciales
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-preview-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/release/*.apk
            output/release/SHA256SUMS.txt
            output/release/release.json
            output/release/project.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Conservar verificaciones previas si falla la liberación
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-preview-diagnostico-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/release/source.json
            output/release/project.json
          retention-days: 7
          if-no-files-found: warn
